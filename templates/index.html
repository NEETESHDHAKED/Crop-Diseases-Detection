<!DOCTYPE html>
<html>
<head><title>Crop Disease Detection</title></head>
<body style="text-align:center; margin-top:60px; font-family:Arial">
<h2>Crop Disease Detection 🌿</h2>
<form id="form" method="POST" enctype="multipart/form-data">
<input type="file" name="file" required><br><br>
<button type="submit">Predict</button>
</form>
<div id="result" style="margin-top:20px; font-weight:bold;"></div>
<script>
document.getElementById('form').addEventListener('submit', async (e)=>{
 e.preventDefault();
 let r = document.getElementById('result');
 r.style.color='black'; r.innerText='Predicting...';
 let fd = new FormData(e.target);
 try{
   let res = await fetch('/predict',{method:'POST', body:fd});
   let txt = await res.text();
   console.log("RAW:",txt);
   try{
     let data = JSON.parse(txt);
     if(data.prediction) { r.style.color='green'; r.innerText='Prediction: '+data.prediction; }
     else { r.style.color='red'; r.innerText='Error from server: '+(data.error||txt); }
   }catch{
     r.style.color='red';
     r.innerText='Server returned non-JSON (check logs):\n'+txt.slice(0,500);
   }
 }catch(err){ r.innerText='Fetch Error: '+err; }
});
</script>
</body>
</html>
